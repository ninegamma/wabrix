[package]
name = "wabrix_wasm"
edition.workspace = true
version.workspace = true

[dependencies]

# WASM Logic
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
log = { workspace = true }
xsk-core = { workspace = true }
dashmap = "6.1" # Using stable 6.1 instead of 7.0-rc2 for reliability
wabrix_base = { workspace = true }
wabrix_api = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
anyhow = "1.0.104"

[lib]
name = "wabrix_wasm"
path = "src/lib.rs"

[features]
performance = []
profiling = []
runtime-diagnostics = []
default = ["profiling"]
