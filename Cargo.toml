[workspace]
members = [
    "wabrix",
    "wabrix_lib",
    "wabrix_wasm",
    "wabrix_base",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.7.0"
authors = ["NineGamma <contact@ninegamma.com>"]
license-file = "LICENSE"

[workspace.dependencies]
wabrix_api = { git = "https://github.com/ninegamma/wabrix_api.git", branch = "main", version= "0.7", features=["host"] }
#wabrix_api = { path = "../wabrix_api", features = ["host"] }
wabrix_base = { path = "wabrix_base" }
wabrix_wasm = { path = "wabrix_wasm" }
libbpf-rs = "0.27.1"
libbpf-sys = { version = "1.7", default-features = false }
xsk-core = { git = "https://github.com/ninegamma/xsk-core.git", branch = "main", version= "0.3" }
# Add these for the Wasm side of the house:
wit-bindgen = "0.60.0"
wasmtime = { version = "50.0.1", features = ["component-model"] }
wasmtime-wasi = "50.0.1"
clap = { version = "4.5", features = ["derive", "std"] }
network-types = { version = "0.2", default-features = false, features = ["zerocopy"] }
zerocopy = { git = "https://github.com/google/zerocopy", default-features = false, features = ["derive"] }
macaddr = { version = "1.0.1", default-features = false, features = ["serde"] }

# Common dependencies
anyhow = "1"
log = { version = "0.4", default-features = false }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
separator = "0.4"
ts-rs = { version= "12.0", features = ["no-serde-warnings"] }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
toml = "1.1"
arc-swap = "1.9.1"
spin = "0.10"
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
netlink-sys = "0.8"
libbpf-cargo = "0.27.0"

[patch.crates-io]
network-types = { git = "https://github.com/ninegamma/network-types.git", branch = "zerocopy" }

[patch."https://github.com/ninegamma/xsk-core.git"]
#xsk-core = { path = "../xsk-core" }

[patch."https://github.com/ninegamma/wabrix_api.git"]
#wabrix_api = { path = "../wabrix_api"}
