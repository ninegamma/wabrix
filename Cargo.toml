[workspace]
members = [
    "wabrix",
    "wabrix_lib",
    "wabrix_wasm",
    "wabrix_base",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
publish = false
authors = ["NineGamma <contact@ninegamma.com>"]
license-file = "LICENSE"

[workspace.dependencies]
wabrix_api = { path = "../wabrix_api/wabrix_api", features=["host"] }
wabrix_base = { path = "wabrix_base" }
wabrix_wasm = { path = "wabrix_wasm" }
libbpf-rs = "^0.26.2"
libbpf-sys = { version = "1.7", default-features = false }
xsk-rs = { git = "https://github.com/rstade/xsk-rs.git", branch = "rstade" }
#xsk-rs = { path = "../xsk-rs" }
# Add these for the Wasm side of the house:
wit-bindgen = "0.54"
wasmtime = { version = "43.0", features = ["component-model"] }
wasmtime-wasi = "43.0"
clap = { version = "4.5", features = ["derive", "std"] }
network-types = { version = "0.2", default-features = false }
macaddr = { version = "1.0.1", default-features = false, features = ["serde"] }

# Common dependencies
anyhow = "1"
log = { version = "0.4", default-features = false }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
separator = "0.4"
ts-rs = { version= "12.0", features = ["no-serde-warnings"] }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
toml = "1.1"
arc-swap = "1.9.1"
spin = "0.10"
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
libbpf-cargo = "0.26"
