[workspace]
members = [
    "ipblower",
    "xbricks",
    "plugins/*",
    "xbricks_protocol",
    "xbricks_lib",
    "xbricks_wasm",
    "xbricks_base",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Define the exact version here once
# libbpf-rs = "=0.26.0-beta.1"
libbpf-rs = "^0.26.2"
#libbpf-sys = "=1.6.1+v1.6.1"
libbpf-sys = { version = "1.7", default-features = false }
#xsk-rs = { git = "https://github.com/rstade/xsk-rs", branch = "rstade", version = "0.8.1" }
xsk-rs = { path = "../xsk-rs" }
# Add these for the Wasm side of the house:
wit-bindgen = "0.54"
wasmtime = { version = "43.0", features = ["component-model"] }
wasmtime-wasi = "43.0"
clap = { version = "4.5", features = ["derive", "std"] }
network-types = { version = "0.2", default-features = false }
macaddr = { version = "1.0.1", default-features = false, features = ["serde"] }

# Common dependencies
anyhow = "1"
log = "0.4"
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
separator = "0.4"
ts-rs = "12.0"
crossbeam-channel = "0.5"
toml = "1.1"
arc-swap = "1.9.1"
spin = "0.10"
env_logger = { version = "0.11", default-features = false }
libc = "0.2"
libbpf-cargo = "0.26"
