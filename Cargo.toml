[workspace]
members = [
    "ipblower",
    "xbricks",
    "plugins/*",
    "xbricks_protocol",
    "xbricks_lib",
    "xbricks_wasm",
    "xbricks_base",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# Define the exact version here once
libbpf-rs = "=0.26.0-beta.1"
#libbpf-sys = "=1.6.1+v1.6.1"
libbpf-sys = { version = "1.6", default-features = false }
#xsk-rs = { git = "https://github.com/rstade/xsk-rs", branch = "rstade", version = "0.8.1" }
xsk-rs = { path = "../xsk-rs" }
# Add these for the Wasm side of the house:
wit-bindgen = "0.54"
wasmtime = { version = "43.0", features = ["component-model"] }
clap = { version = "4.5", features = ["derive", "std"] }

