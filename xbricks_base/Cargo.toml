[package]
name = "xbricks_base"
edition.workspace = true
version.workspace = true

[dependencies]
xsk-rs = { workspace = true }
macaddr = { workspace = true }
xbricks_protocol = { path = "../xbricks_protocol" }
crossbeam-channel = "0.5"
log = "0.4.29"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
separator = "0.4.1"
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = "12.0.1" # Note: 1.49 is very new, 1.40 is stable

[features]
performance = []
profiling = []
default = ["profiling"]