[package]
name = "xbricks_wasm"
edition.workspace = true
version.workspace = true

[dependencies]

# WASM Logic
wasmtime = "43"
wasmtime-wasi = "43"
wasmtime-component-macro = "29"
anyhow = "1.0"
log = "0.4"
xsk-rs = { workspace = true }
dashmap = "6.1" # Using stable 6.1 instead of 7.0-rc2 for reliability
xbricks_base = { path = "../xbricks_base" }

[lib]
name = "xbricks_wasm"
path = "src/lib.rs"

[features]
performance = []
profiling = []
default = ["profiling"]