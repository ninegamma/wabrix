[package]
name = "wabrix_lib"
edition.workspace = true
version.workspace = true

[dependencies]
wabrix_base = { path = "../wabrix_base" }
wabrix_api = { workspace = true }

# Standard Tools
anyhow = { workspace = true }
log = { workspace = true }
libc = { workspace = true }
rustix = { version = "1.1", features = ["event", "time"] } # Added features for networking
spin = { workspace = true }

# Networking & BPF
xsk-rs = { workspace = true }
libbpf-rs = { workspace = true }
libbpf-sys = { workspace = true }
network-types = { workspace = true }
ipnet = "2.12"
macaddr = { workspace = true }

# Serialization & Config
serde = { workspace = true }
ts-rs = { workspace = true }
toml = { workspace = true }
separator = { workspace = true }

# Async & Concurrency
tokio = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = { workspace = true }

core_affinity = "0.8"
rand = "0.10"


# Wasm
wabrix_wasm = { path = "../wabrix_wasm", optional = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
cargo_metadata = "0.18"
libbpf-cargo = { workspace = true }

[features]
performance = []
profiling = []
# Create a 'wasm' feature that enables the dependency
wasm = ["dep:wabrix_wasm"]
default = ["profiling", "wasm"]

[lib]
name = "wabrix_lib"
path = "src/lib.rs"