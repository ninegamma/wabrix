[package]
name = "wabrix"
license = "MIT OR Apache-2.0"
edition.workspace = true
version.workspace = true

[dependencies]

anyhow = { workspace = true }
log = { workspace = true, default-features = false }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
clap = { workspace = true }
separator = { workspace = true }
arc-swap = { workspace = true }
wabrix_lib = { path = "../wabrix_lib" }
wabrix_base = { path = "../wabrix_base" }
env_logger = "0.11.11"
prometheus = "0.14.0"
ureq = "3.3.0"
crossbeam-channel = "0.5.16"

[build-dependencies]
anyhow = { workspace = true }

[features]
performance = []
profiling = []
runtime-diagnostics = ["wabrix_lib/runtime-diagnostics"]
default = ["profiling"]
# This says: "The wasm feature for wabrix activates the wasm feature for wabrix_lib"
wasm = ["wabrix_lib/wasm"]

[[bin]]
name = "wabrix"
path = "src/main.rs"
