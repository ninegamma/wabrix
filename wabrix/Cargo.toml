[package]
name = "wabrix"
license = "MIT OR Apache-2.0"
edition.workspace = true
version.workspace = true

[dependencies]

anyhow = { workspace = true }
env_filter = "0.1"
log = { workspace = true, default-features = false }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
toml_edit = { version = "0.22", features = ["serde"] }
serde = { workspace = true }
separator = { workspace = true }
pcap-file = "3.0.0-rc1"
serde_json = "1.0"
futures-util = { version = "0.3", features = ["sink"] }
tower-http = { version = "0.6", features = ["fs"] }
ts-rs = { workspace = true }
arc-swap = { workspace = true }
wabrix_lib = { path = "../wabrix_lib" }
wabrix_base = { path = "../wabrix_base" }
wabrix_api = { workspace= true}
env_logger = "0.11.11"

[build-dependencies]
anyhow = { workspace = true }

[features]
performance = []
profiling = []
default = ["profiling"]
# This says: "The wasm feature for wabrix activates the wasm feature for wabrix_lib"
wasm = ["wabrix_lib/wasm"]

[[bin]]
name = "wabrix"
path = "src/main.rs"

