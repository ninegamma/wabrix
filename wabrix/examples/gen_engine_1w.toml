[wabrix]
ifaces= [
    { name = "enp2s0f0np0", rxd = 8096, txd = 8096, irq_core = 2, napi = { flush_timeout_ns = 60000, defer_irqs = 256 } },
    { name = "enp2s0f1np1", rxd = 8096, txd = 8096, irq_core = 3, rx_timestamp = false, napi = { flush_timeout_ns = 100000, defer_irqs = 512 } },
    #{ name = "enp2s0f1np1", rxd = 8096, txd = 8096, irq_core = 5 } ,
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 301056, fq_size = 32768, cq_size = 32768, head_room = 128, partitions = 3 },
    { id = 1, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 32768, head_room = 128, partitions = 1 },
]

# Optional XSK fields:
# poll_mode = "napi_busy_poll" enables kernel/NAPI busy polling;
# napi_poll_timeout_ns controls the userspace poll timeout; busy_poll_ns controls
# the kernel/NAPI busy-poll duration. Both values are in nanoseconds.
# Missing poll_mode defaults to "userspace_ring_spin".
xsk= [
    { iface = "enp2s0f0np0", queues = [0], umem = 0, rxq_size = 32768, txq_size = 32768, zerocopy = true, xdp_mode = "auto",  poll_mode = "napi_busy_poll", napi_poll_timeout_ns = 2_050, busy_poll_ns = 2_000, busy_poll_budget= 512 },
    { iface = "enp2s0f1np1", queues = [0], umem = 1, rxq_size = 32768, txq_size = 32768, zerocopy = true, xdp_mode = "auto",  poll_mode = "napi_busy_poll", napi_poll_timeout_ns = 2_050, busy_poll_ns = 2_000, busy_poll_budget= 512 },
#    { iface = "enp2s0f1np1", queues = [0], umem = 1, rxq_size = 16384, txq_size = 16384, zerocopy = true, xdp_mode = "auto",  poll_mode = "userspace_ring_spin"},
]

workers= [
    { id = 0, core = 2, partitions = [{ umem = 0, count = 1 }] },
    { id = 1, core = 3, partitions = [{ umem = 1, count = 1 }] },
]


[[pipelines]]
# ===================================================================
# PIPELINE: generator
# ===================================================================
name = "generator_pipe"
workers = [0]
poll_frequency = 50000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running delay=2"

[[pipelines.nodes]]
id = "generator_engine"
type = "WasmEngine"
routes = ["tx_f0np0", "drop", "drop"]
# Node-level state override
desired_state = "Running"
args= { umem = "0", batch_size="512" }
hot_args= { wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/generator_engine.wasm" }

[pipelines.nodes.node_data]
prot = "UDP"
dst_ip = "10.10.10.31"
src_mac = "44:49:88:06:63:38"
dst_mac = "44:49:88:06:63:39"
src_ip = "10.10.10.222"

[pipelines.nodes.hot_node_data]
generation_limit = "500M"
generation_rate = "16500K"

[[pipelines.nodes]]
id = "tx_f0np0"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "enp2s0f0np0", sink_type = "xsk" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}


[[pipelines]]
# ===================================================================
# PIPELINE: inspector
# ===================================================================
name = "inspector_pipe"
workers = [1]
poll_frequency = 5000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running"

[[pipelines.nodes]]
id = "rx_f1np1"
type = "BatchRxNode"
routes = ["rx_parser"]
queues = [0]
args= { interface = "enp2s0f1np1", batch_size = "512" }
hot_args= {}

[[pipelines.nodes]]
id = "rx_parser"
type = "FastParserNode"
routes = ["inspector"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "inspector"
type = "WasmEngine"
routes = ["drop", "drop"]
#routes = ["tx_f1np1", "drop"]
# Node-level state override
desired_state = "Running"
args= { umem = "1", wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/inspector_engine.wasm" }
hot_args= {}

[pipelines.nodes.node_data]
src_ip = "10.10.10.31"
src_mac = "44:49:88:06:63:39"
dst_mac = "44:49:88:06:63:38"

[pipelines.nodes.hot_node_data]

[[pipelines.nodes]]
id = "tx_f1np1"
type = "BatchTxNode"
routes = []
queues = [0]
args= { sink_type = "xsk", interface = "enp2s0f1np1" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}
