[wabrix]
ifaces= [
    { name = "enp2s0f0np0", rxd = 8096, txd = 8096, irq_core = 8 },
    { name = "enp2s0f1np1", rxd = 8096, txd = 8096, irq_core = 3, napi = { flush_timeout_ns = 60000, defer_irqs = 1024 } },
    #{ name = "enp2s0f1np1", rxd = 8096, txd = 8096, irq_core = 3 } ,
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 32768, head_room = 128, partitions = 1, reserved = 131072 },
    { id = 1, frame_size = 2048, frame_count = 1048576, fq_size = 262144, cq_size = 32768, head_room = 128, partitions = 1, reserved = 131072 },
]

# Optional XSK fields:
# poll_mode = "napi_busy_poll" enables kernel/NAPI busy polling;
# busy_poll_ns = 20_000 sets its per-socket timeout. Missing poll_mode defaults to
# "userspace_ring_spin".
xsk= [
    { iface = "enp2s0f0np0", queues = [0], umem = 0, rxq_size = 32768, txq_size = 32768, zerocopy = true, xdp_mode = "auto" },
    { iface = "enp2s0f1np1", queues = [0], umem = 1, rxq_size = 32768, txq_size = 32768, zerocopy = true, xdp_mode = "auto",  poll_mode = "napi_busy_poll", busy_poll_ns = 2_050, busy_poll_budget= 1024 },
#    { iface = "enp2s0f1np1", queues = [0], umem = 1, rxq_size = 16384, txq_size = 16384, zerocopy = true, xdp_mode = "auto",  poll_mode = "userspace_ring_spin"},
]

workers= [
    { id = 0, core = 2, partitions = [{ umem = 0, count = 1 }] },
    { id = 1, core = 3, partitions = [{ umem = 1, count = 1 }] },
]

# ===================================================================
# PIPELINE: generator
# ===================================================================
[[pipelines]]
name = "generator_pipe"
workers = [0]
poll_frequency = 40000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running delay=1000"

[[pipelines.nodes]]
id = "generator_engine"
type = "WasmEngine"
routes = ["tx_sink_0", "drop", "drop"]
labels = ["SentPackets", "SentSynAck", "SentSynAck2", "SentFin", "SentFinPssv", "SentAck4Fin", "SentAck", "SentRst", "RecvSyn", "RecvSynAck", "RecvSynAck2", "RecvFin", "RecvFinPssv", "RecvAck4Fin", "RecvAck", "RecvRst", "Unexpected", "RecvPayload", "SentPayload", "TickDrop", "ToLinux", "Drop", "Watermark"]
# Node-level state override
desired_state = "Running"
args= { umem = "0", batch_size="512" }
hot_args= { wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/generator_engine.wasm" }

[pipelines.nodes.wasm_data]
prot = "UDP"
dst_ip = "10.10.10.31"
src_mac = "44:49:88:06:63:38"
dst_mac = "44:49:88:06:63:39"
src_ip = "10.10.10.222"

[pipelines.nodes.hot_wasm_data]
syn_limit = "200M"
syn_rate = "12000K"

[[pipelines.nodes]]
id = "tx_sink_0"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "enp2s0f0np0", sink_type = "xsk" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}


[[pipelines]]
name = "inspector_pipe"
workers = [1]
poll_frequency = 1000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running"

[[pipelines.nodes]]
id = "rx_source"
type = "BatchRxNode"
routes = ["rx_parser"]
queues = [0]
args= { interface = "enp2s0f1np1", batch_size = "512" }
hot_args= {}

[[pipelines.nodes]]
id = "rx_parser"
type = "FastParserNode"
routes = ["inspector"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "inspector"
type = "WasmEngine"
routes = ["drop"]
labels = ["RecvPackets", "RecvBytes", "Unexpected", "AverageDelayUs", "StdDevDelayUs"]
# Node-level state override
desired_state = "Running"
args= { umem = "1", wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/inspector_engine.wasm" }
hot_args= {}

[pipelines.nodes.wasm_data]
src_ip = "10.10.10.31"
src_mac = "44:49:88:06:63:39"
dst_mac = "44:49:88:06:63:38"

[pipelines.nodes.hot_wasm_data]


[[pipelines.nodes]]
id = "tx_sink_1"
type = "BatchTxNode"
routes = []
queues = [0]
args= { sink_type = "xsk", interface = "enp2s0f1np1" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}
