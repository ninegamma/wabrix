[wabrix]
ifaces= [
    { name = "enp2s0f0np0", rxd = 8096, txd = 2048, irq_core = 8 },
    { name = "veth_xbricks", rxd = 1024, txd = 1024, type = "veth", peer = "veth-br", master = "kvm-br", checksum_offload = false },
    { name = "enp2s0f1np1", rxd = 8096, txd = 8096 },
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 16384, head_room = 128, partitions = 2 },
    { id = 1, frame_size = 2048, frame_count = 131072, fq_size = 16384, cq_size = 16384, head_room = 128, partitions = 2 },
]
xsk= [
    { iface = "enp2s0f0np0", queues = [0, 1], umem = 0, rxq_size = 16384, txq_size = 4096, zerocopy = true, xdp_mode = "auto" },
    { iface = "veth_xbricks", queues = [0, 1], umem = 1, rxq_size = 4096, txq_size = 4096, zerocopy = false, xdp_mode = "auto" },
    { iface = "enp2s0f1np1", queues = [0, 1], umem = 0, rxq_size = 8192, txq_size = 8192, zerocopy = true, xdp_mode = "auto" },
]
workers= [
    { id = 0, core = 9, partitions = [{ umem = 0, count = 1 }, { umem = 1, count = 1 }] },
    { id = 1, core = 7, partitions = [{ umem = 0, count = 1 }, { umem = 1, count = 1 }] },
]

# ===================================================================
# PIPELINE: NIC0_IN
# ===================================================================
[[pipelines]]
name = "nic0_in"
workers = [0, 1]

[[pipelines.nodes]]
id = "nd_receiver"
type = "BatchRxNode"
routes = ["nd_parser"]
queues = [0, 1]
args= { interface = "enp2s0f0np0", batch_size = "256" }

[pipelines.nodes.hot_args]

[[pipelines.nodes]]
id = "nd_parser"
type = "FastParserNode"
routes = ["nd_veth_sink"]
args= {}

[pipelines.nodes.hot_args]

[[pipelines.nodes]]
id = "nd_veth_sink"
type = "BatchTxNode"
routes = []
queues = [0, 1]
args= { interface = "veth_xbricks" }

[pipelines.nodes.hot_args]

[[pipelines.nodes]]
id = "nd_drop"
type = "DropNode"
routes = []
args= {}

[pipelines.nodes.hot_args]

# ===================================================================
# PIPELINE: NIC0_OUT
# ===================================================================
[[pipelines]]
name = "nic0_out"
workers = [0, 1]

[[pipelines.nodes]]
id = "nd_veth_source"
type = "BatchRxNode"
routes = ["nd_parser_veth"]
queues = [0, 1]
args= { interface = "veth_xbricks" }

[pipelines.nodes.hot_args]

[[pipelines.nodes]]
id = "nd_parser_veth"
type = "FastParserNode"
routes = ["nd_transmitter"]
args= {}

[pipelines.nodes.hot_args]


[[pipelines.nodes]]
id = "nd_drop"
type = "DropNode"
routes = []
args= {}

[pipelines.nodes.hot_args]

[[pipelines.nodes]]
id = "nd_transmitter"
type = "BatchTxNode"
routes = []
queues = [0, 1]
args= { interface = "enp2s0f0np0" }

[pipelines.nodes.hot_args]

# ===================================================================
# PIPELINE: GENERATOR
# ===================================================================
[[pipelines]]
name = "generator"
workers = [0, 1]

[[pipelines.nodes]]
id = "pctgen"
type = "PacketGenerator"
routes = ["tx_sink_1"]
args= { wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/generator_plugin.wasm", umem = "0",   no-zerocopy = "false" }

[pipelines.nodes.hot_args]
packet_count = "256000"
pps = "2M"
dst_ip = "192.168.177.222"
dst_mac = "44:49:88:06:63:38"
batch_size = "256"

[pipelines.nodes.node_data]
dst_ip = "192.168.177.222"
rng_seed = "235467"
src_mac = "44:49:88:06:63:39"
dst_mac = "44:49:88:06:63:38"
src_ip = "192.168.177.224"

[[pipelines.nodes]]
id = "tx_sink_1"
type = "BatchTxNode"
routes = []
queues = [0, 1]
args= { sink_type = "xsk", interface = "enp2s0f1np1" }

[pipelines.nodes.hot_args]
