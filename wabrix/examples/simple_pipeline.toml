# Multi-interface, single UMEM configuration example
# Demonstrates multiple NICs with one UMEM domain
#
# Architecture:
# - Worker: single-threaded execution unit running on one core (multiple workers can share a core)
# - Pipeline: logical packet processing graph assigned to one or more workers
#   * Each worker gets its own instance of the pipeline
#   * Node queues array maps 1:1 with pipeline workers array (queues[i] → workers[i])
# - Node: processing element bound to (interface, queues) pair
# - Queue core affinity: DERIVED from worker->pipeline->node->queue chain
#
# Validation rules:
# - Node queues array length must equal pipeline workers array length
# - Each queue should map to exactly one core (via the worker->pipeline->node chain)
# - pipeline.workers must reference valid worker IDs from workers section
# - Node IDs are namespaced per pipeline to prevent collisions

[wabrix]
# Interface declarations (descriptive only - queue count determined by xsk config)
ifaces = [
    { name = "enp2s0f0np0", rxd = 2048, txd = 2048 },
    { name = "enp2s0f1np1", rxd = 2048, txd = 2048 }
]

umem = [
    { id = 0, frame_size = 2048, frame_count = 32768, fq_size = 2048, cq_size = 2048, head_room = 128, partitions = 2 },
]

# --- XSK SOCKET CONFIG ---
# XSK socket configuration (core affinity is derived from worker assignments)
xsk = [
    { iface = "enp2s0f0np0", queues = [0, 1], umem = 0, rxq_size = 2048, txq_size = 2048, zerocopy = true },
    { iface = "enp2s0f1np1", queues = [0, 1], umem = 0, rxq_size = 2048, txq_size = 2048, zerocopy = true },
]

# --- WORKER & PARTITION ASSIGNMENT ---
# Workers request specific partition quotas from the UMEMs.
# The builder automatically pops the next available partition index for that UMEM.
workers = [
    { id = 0, core = 0, partitions = [ { umem = 0, count = 1 } ] },
    { id = 1, core = 1, partitions = [ { umem = 0, count = 1 } ] }
]

[[pipelines]]
name = "wire_f0_to_f1"
workers = [0, 1]

    # --- Node 1: Source ---
    [[pipelines.nodes]]
    id = "rx_source_0"
    type = "BatchRxNode"
    routes = ["ethertype_stats_01"]
    queues = [0, 1]
    args = { source_type = "xsk", interface = "enp2s0f0np0", batch_size= "64" }

    # --- Telemetry Node ---
    [[pipelines.nodes]]
    id = "ethertype_stats_01"
    type = "TelemetryNode"
    routes = ["tx_sink_1"]

    [pipelines.nodes.args]
    algo = "ethertype"
    buckets = "4"         # We expect 4 buckets (IPv4, IPv6, ARP, Other)
    labels = "IPv4,IPv6,ARP,Other" # Optional: For the metrics exporter to name them

    # --- Node 2: Sink ---
    [[pipelines.nodes]]
    id = "tx_sink_1"
    type = "BatchTxNode"
    queues = [0, 1]
    args = { sink_type = "xsk", interface = "enp2s0f1np1" }


[[pipelines]]
name = "wire_f1_to_f0"
workers = [0, 1]

    # --- Node 1: Source ---
    [[pipelines.nodes]]
    id = "rx_source_1"
    type = "BatchRxNode"
    routes = ["ethertype_stats_10"]
    queues = [0, 1]
    args = { source_type = "xsk", interface = "enp2s0f1np1"}

    # --- Telemetry Node ---
    [[pipelines.nodes]]
    id = "ethertype_stats_10"
    type = "TelemetryNode"
    routes = ["tx_sink_0"]

    [pipelines.nodes.args]
    algo = "ethertype"
    buckets = "4"         # We expect 4 buckets (IPv4, IPv6, ARP, Other)
    labels = "IPv4,IPv6,ARP,Other" # Optional: For the metrics exporter to name them


    # --- Node 2: Sink ---
    [[pipelines.nodes]]
    id = "tx_sink_0"
    type = "BatchTxNode"
    queues = [0, 1]
    args = { sink_type = "xsk", interface = "enp2s0f0np0"}


