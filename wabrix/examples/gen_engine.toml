[wabrix]
ifaces= [
    { name = "enp2s0f0np0", rxd = 8160, txd = 8160, irq_core = 5 },
    { name = "enp2s0f1np1", rxd = 8160, txd = 8160, irq_core = 5 },
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 32768, head_room = 128, partitions = 2 },
    { id = 1, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 32768, head_room = 128, partitions = 2 },
]
xsk= [
    { iface = "enp2s0f0np0", queues = [0, 1], umem = 0, rxq_size = 16384, txq_size = 16384, zerocopy = true, xdp_mode = "auto" },
    { iface = "enp2s0f1np1", queues = [0], umem = 1, rxq_size = 16384, txq_size = 16384, zerocopy = true, xdp_mode = "auto" },
#    { iface = "enp2s0f1np1", queues = [1], umem = 1, rxq_size = 16384, txq_size = 16384, zerocopy = true, xdp_mode = "auto" },
]
workers= [
    { id = 0, core = 2, partitions = [{ umem = 0, count = 1 }] },
    { id = 1, core = 3, partitions = [{ umem = 0, count = 1 }] },
    { id = 2, core = 4, partitions = [{ umem = 1, count = 1 }] },
]

# ===================================================================
# PIPELINE: generator
# ===================================================================
[[pipelines]]
name = "generator_pipe"
workers = [0, 1]
poll_frequency = 20000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running delay=1000"

[[pipelines.nodes]]
id = "generator_engine"
type = "WasmEngine"
routes = ["tx_sink_0", "drop", "drop"]
# Node-level state override
desired_state = "Running"
args= { umem = "0", batch_size = "512" }
hot_args= { wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/generator_engine.wasm" }
