# ===================================================================
# PIPELINE: tcp_client
# ===================================================================
[[pipelines]]
name = "tcp_client"
workers = [0]
poll_frequency = 10000
# Target lifecycle state for this pipeline
# Valid values: "Running", "Paused",
desired_state = "Running delay=100"

[[pipelines.nodes]]
id = "rx_source"
type = "BatchRxNode"
routes = ["nd_parser"]
queues = [0]
args= { interface = "enp2s0f0np0", batch_size = "512" }
hot_args= {}

[[pipelines.nodes]]
id = "nd_veth_source"
type = "BatchRxNode"
routes = ["nd_parser_veth"]
queues = [0]
args= { interface = "veth_wabrix" }
hot_args= {}

[[pipelines.nodes]]
id = "nd_parser"
type = "FastParserNode"
routes = ["client"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "client"
type = "WasmEngine"
routes = ["shared_tx_sink", "veth_sink", "drop"]
labels = ["SentSyn", "SentSynAck", "SentSynAck2", "SentFin", "SentFinPssv", "SentAck4Fin", "SentAck", "SentRst", "RecvSyn", "RecvSynAck", "RecvSynAck2", "RecvFin", "RecvFinPssv", "RecvAck4Fin", "RecvAck", "RecvRst", "Unexpected", "RecvPayload", "SentPayload", "TickDrop", "ToLinux", "Drop", "Watermark"]
# Node-level state override
desired_state = "Running"
args= { umem = "0", batch_size = "512" }
hot_args= { wasm_file_path = "/home/rainer1956/wabrix_prj/wabrix_api/target/wasm32-wasip2/release/tcp_engine.wasm" }

[pipelines.nodes.node_data]
dst_ip = "10.10.10.31"
src_mac = "44:49:88:06:63:38"
dst_mac = "44:49:88:06:63:39"
src_ip = "10.10.10.222"

[pipelines.nodes.hot_node_data]
syn_limit = "30M"
close_timeout = "100"
syn_rate = "700k"

[[pipelines.nodes]]
id = "nd_parser_veth"
type = "FastParserNode"
routes = ["shared_tx_sink"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "shared_tx_sink"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "enp2s0f0np0", sink_type = "xsk" }
hot_args= {}

[[pipelines.nodes]]
id = "veth_sink"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "veth_wabrix" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}

