# Multi-interface, single UMEM configuration example
# Demonstrates multiple NICs with one UMEM domain
#
# UMEM allocation:
# - UMEM 0: 16384 total frames shared by 2 cores = 8192 frames per core (cores 0,1)

[wabrix]
ifaces = [
    { name = "enp114s0f0", rxd = 512, txd = 512 },
    { name = "enp114s0f1", rxd = 1024, txd = 1024 }
]

umem = [
    # UMEM 0: 16384 frames shared by 2 cores = 8192 each
    { id = 0, frame_size = 2048, frame_count = 16384, fq_size = 4096, cq_size = 4096, head_room = 128 },
]

xsk = [
    { iface = "enp114s0f0", queues = [0, 1], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true },
    { iface = "enp114s0f1", queues = [0, 1], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true }
]

workers = [
    { id = 0, core = 0 },
    { id = 1, core = 1 }
]

