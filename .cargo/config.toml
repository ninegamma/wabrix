[env]
# this is no longer required, as we set the path explicitely,
# however, we keep it here, just in case we need it again
TS_RS_EXPORT_DIR = { value = "xbricks-ui/src/types", relative = true }

# Optimization: Since you are doing AF_XDP, you might want to force
# native CPU instructions for the whole workspace
RUSTFLAGS = "-C target-cpu=native"