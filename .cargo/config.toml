[env]
# this is no longer required, as we set the path explicitely,
# however, we keep it here, just in case we need it again
TS_RS_EXPORT_DIR = { value = "xbricks-ui/src/types", relative = true }

[build]
# Optimization: Since we are doing AF_XDP, force native CPU instructions
# for the whole workspace. (This acts as the default).
rustflags = ["-C", "target-cpu=native"]

[target.'cfg(unix)']
runner = "sudo -E"
