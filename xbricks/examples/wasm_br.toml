# ===================================================================
# PIPELINE: NIC0_IN
# ===================================================================
[[pipelines]]
name = "nic0_in"
workers = [0, 1]

[[pipelines.nodes]]
id = "nd_receiver"
type = "BatchRxNode"
routes = ["nd_parser"]
queues = [0, 1]
args= { batch_size = "256", interface = "enp2s0f0np0" }

[[pipelines.nodes]]
id = "nd_parser"
type = "FastParserNode"
routes = ["nd_wasm_inspector"]
args= {}

[[pipelines.nodes]]
id = "nd_wasm_inspector"
type = "WasmInspectorNode"
routes = ["nd_veth_sink", "nd_drop"]
labels = ["icmp ping", "icmp reply", "icmp other", "any other"]
args= { wasm_file_path = "/home/rainer1956/rust/xbrix/target/wasm32-wasip2/release/icmp_filter.wasm", umem = "0" }

[[pipelines.nodes]]
id = "nd_veth_sink"
type = "BatchTxNode"
routes = []
queues = [0, 1]
args= { interface = "veth_xbricks" }

[[pipelines.nodes]]
id = "nd_drop"
type = "DropNode"
routes = []
args= {}

# ===================================================================
# PIPELINE: NIC0_OUT
# ===================================================================
[[pipelines]]
name = "nic0_out"
