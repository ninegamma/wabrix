    { name = "enp2s0f1np1", rxd = 8096, txd = 8096 },
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 262144, fq_size = 65536, cq_size = 16384, head_room = 128, partitions = 2, reserved = 30720 },
    { id = 1, frame_size = 2048, frame_count = 131072, fq_size = 16384, cq_size = 16384, head_room = 128, partitions = 2, reserved = 10240 },
]
xsk= [
    { iface = "enp2s0f0np0", queues = [0], umem = 0, rxq_size = 32768, txq_size = 4096, zerocopy = true, xdp_mode = "auto" },
    { iface = "enp2s0f0np0", queues = [1], umem = 0, rxq_size = 32768, txq_size = 4096, zerocopy = true, xdp_mode = "auto" },
    { iface = "veth_xbricks", queues = [0, 1], umem = 1, rxq_size = 4096, txq_size = 4096, zerocopy = false, xdp_mode = "auto" },
    { iface = "enp2s0f1np1", queues = [0], umem = 0, rxq_size = 8192, txq_size = 8192, zerocopy = true, xdp_mode = "auto" },
]
workers= [
    { id = 0, core = 9, partitions = [{ umem = 0, count = 1 }, { umem = 1, count = 1 }] },
    { id = 1, core = 7, partitions = [{ umem = 0, count = 1 }, { umem = 1, count = 1 }] },
]

