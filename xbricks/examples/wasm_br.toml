workers = [0, 1]

[[pipelines.nodes]]
id = "nd_receiver"
type = "BatchRxNode"
next = "nd_parser"
routes = []
queues = [0, 1]
labels = []
args= { batch_size = "256", interface = "enp2s0f0np0" }

[[pipelines.nodes]]
id = "nd_parser"
type = "FastParserNode"
next = "nd_wasm_inspector"
routes = []
queues = []
labels = []
args= {}

[[pipelines.nodes]]
