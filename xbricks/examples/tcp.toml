[xbricks]
ifaces= [
    { name = "enp2s0f0np0", rxd = 8096, txd = 2048, irq_core = 8 },
    { name = "veth_xbricks", rxd = 1024, txd = 1024, type = "veth", namespace = "ns-xbricks", peer = "tap-veth", mac_if = "enp2s0f0np0", ipnet = "10.10.10.222/24", checksum_offload = false },
]
umem= [
    { id = 0, frame_size = 2048, frame_count = 524288, fq_size = 32768, cq_size = 16384, head_room = 128, partitions = 1, reserved = 30720 },
    { id = 1, frame_size = 2048, frame_count = 131072, fq_size = 16384, cq_size = 16384, head_room = 128, partitions = 1, reserved = 10240 },
]
xsk= [
    { iface = "enp2s0f0np0", queues = [0], umem = 0, rxq_size = 16384, txq_size = 4096, zerocopy = true, xdp_mode = "auto" },
    { iface = "veth_xbricks", queues = [0], umem = 1, rxq_size = 4096, txq_size = 4096, zerocopy = false, xdp_mode = "auto" },
]
workers= [
    { id = 0, core = 9, partitions = [{ umem = 0, count = 1 }, { umem = 1, count = 1 }] },
]

# ===================================================================
# PIPELINE: UNIFIED_NIC0
# ===================================================================
[[pipelines]]
name = "unified_nic0"
workers = [0]
poll_frequency = 1000

[[pipelines.nodes]]
id = "rx_source"
type = "BatchRxNode"
routes = ["nd_parser"]
queues = [0]
args= { batch_size = "256", interface = "enp2s0f0np0" }
hot_args= {}

[[pipelines.nodes]]
id = "nd_veth_source"
type = "BatchRxNode"
routes = ["nd_parser_veth"]
queues = [0]
args= { interface = "veth_xbricks" }
hot_args= {}

[[pipelines.nodes]]
id = "nd_parser"
type = "FastParserNode"
routes = ["tcp_engine"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "tcp_engine"
type = "WasmEngine"
routes = ["shared_tx_sink", "veth_sink", "drop"]
labels = ["Drops", "Linux", "Replies", "SYNs", "FINs"]
args= { wasm_file_path = "/home/rainer1956/rust/xbricks_public/target/wasm32-wasip2/release/tcp_engine.wasm", umem = "0" }
hot_args= {}

[pipelines.nodes.wasm_data]
src_ip = "10.10.10.222"
src_mac = "44:49:88:06:63:38" # enp2s0f0np0 (WASM Side)
dst_ip = "10.10.10.31"
dst_mac = "44:49:88:06:63:39" # enp2s0f1np1 (Linux Side)
syn_rate = "100000"   # Hertz
syn_limit = "100"
close_timeout = "5000"  # millis

[[pipelines.nodes]]
id = "nd_parser_veth"
type = "FastParserNode"
routes = ["nd_icmp_filter"]
args= {}
hot_args= {}

[[pipelines.nodes]]
id = "nd_icmp_filter"
type = "WasmInspectorNode"
routes = ["shared_tx_sink", "drop"]
labels = ["icmp ping", "icmp reply", "icmp other", "any other"]
args= { umem = "1", wasm_file_path = "/home/rainer1956/rust/xbricks_public/target/wasm32-wasip2/release/icmp_filter.wasm" }
hot_args= {}

[[pipelines.nodes]]
id = "shared_tx_sink"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "enp2s0f0np0", sink_type = "xsk" }
hot_args= {}

[[pipelines.nodes]]
id = "veth_sink"
type = "BatchTxNode"
routes = []
queues = [0]
args= { interface = "veth_xbricks" }
hot_args= {}

[[pipelines.nodes]]
id = "drop"
type = "DropNode"
routes = []
args= {}
hot_args= {}

