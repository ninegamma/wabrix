# Multi-interface, single UMEM configuration example
# Demonstrates multiple NICs with one UMEM domain
#
# Architecture:
# - Worker: single-threaded execution unit running on one core (multiple workers can share a core)
# - Pipeline: logical packet processing graph assigned to one or more workers
#   * Each worker gets its own instance of the pipeline
#   * Node queues array maps 1:1 with pipeline workers array (queues[i] → workers[i])
# - Node: processing element bound to (interface, queues) pair
# - Queue core affinity: DERIVED from worker->pipeline->node->queue chain
#
# Validation rules:
# - Node queues array length must equal pipeline workers array length
# - Each queue should map to exactly one core (via the worker->pipeline->node chain)
# - pipeline.workers must reference valid worker IDs from workers section
# - Node IDs are namespaced per pipeline to prevent collisions

[xbricks]
# Interface declarations (descriptive only - queue count determined by xsk config)
ifaces = [
    { name = "enp2s0f0np0", rxd = 512, txd = 512 },
    { name = "enp2s0f1np1", rxd = 1024, txd = 1024 }
]

umem = [
    # UMEM 0: Shared memory region for both interfaces
    { id = 0, frame_size = 2048, frame_count = 16384, fq_size = 4096, cq_size = 4096, head_room = 128, partitions= 4 },
]

# XSK socket configuration (core affinity is derived from worker assignments)
xsk = [
    { iface = "enp2s0f0np0", queues = [0, 1, 2, 3], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true },
    { iface = "enp2s0f1np1", queues = [0, 1, 2, 3], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true },
]

# Worker to core mapping
workers = [
    { id = 0, core = 0, partitions = [ { umem = 0, count = 1 } ] },
    { id = 1, core = 1, partitions = [ { umem = 0, count = 1 } ] },
    { id = 2, core = 2, partitions = [ { umem = 0, count = 2 } ] }
]


[[pipelines]]
name = "l2_reflector"
workers = [0, 1]

    # --- Node 1: Source ---
    [[pipelines.nodes]]
    id = "l2_reflector.rx_root"
    type = "BatchRxNode"
    routes = ["l2_reflector.classifier"]
    queues = [0, 1]
    args = { source_type = "xsk", interface = "enp2s0f0np0" }

    # --- Node 2: Classifier ---
    [[pipelines.nodes]]
    id = "l2_reflector.classifier"
    type = "ClassifierNode"
    routes = ["l2_reflector.mac_swapper", "l2_reflector.drop_sink"]
    default = "l2_reflector.drop_sink"
    args = { algo = "ipv4_filter" }

    # --- Node 3: Transformer ---
    [[pipelines.nodes]]
    id = "l2_reflector.mac_swapper"
    type = "MacSwapNode"
    routes = ["l2_reflector.tx_sink"]
    args = {}

    # --- Node 4: Sink ---
    [[pipelines.nodes]]
    id = "l2_reflector.tx_sink"
    type = "BatchTxNode"
    queues = [0, 1]
    args = { sink_type = "xsk", interface = "enp2s0f0np0" }

    # --- Node 5: Drop ---
    [[pipelines.nodes]]
    id = "l2_reflector.drop_sink"
    type = "DropNode"
    args = {}

[[pipelines]]
name = "drop_if_0"
workers = [2, 2]

    # --- Node 1: Source ---
    [[pipelines.nodes]]
    id = "drop_if_0.rx_root"
    type = "BatchRxNode"
    routes = ["drop_if_0.drop_sink"]
    queues = [2, 3]
    args = { source_type = "xsk", interface = "enp2s0f0np0" }

    # --- Node 2: Drop ---
    [[pipelines.nodes]]
    id = "drop_if_0.drop_sink"
    type = "DropNode"
    args = {}

[[pipelines]]
name = "drop_if_1"
workers = [2, 2, 2 ,2]

    # --- Node 1: Source ---
    [[pipelines.nodes]]
    id = "drop_if_1.rx_root"
    type = "BatchRxNode"
    routes = ["drop_if_1.drop_sink"]
    queues = [0, 1, 2, 3]
    args = { source_type = "xsk", interface = "enp2s0f1np1" }

    # --- Node 2: Drop ---
    [[pipelines.nodes]]
    id = "drop_if_1.drop_sink"
    type = "DropNode"
    args = {}