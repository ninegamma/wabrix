# Multi-interface, two UMEM configuration example
# Demonstrates multiple NICs with two UMEM domains
# This file is only for parser checking, pipelines are illegal as they mix frames of different Umems
#
# Architecture:
# - Worker: single-threaded execution unit running on one core (multiple workers can share a core)
# - Pipeline: logical packet processing graph assigned to one or more workers
#   * Each worker gets its own instance of the pipeline
#   * Node queues array maps 1:1 with pipeline workers array (queues[i] → workers[i])
# - Node: processing element bound to (interface, queues) pair
# - Queue core affinity: DERIVED from worker->pipeline->node->queue chain
#
# Validation rules:
# - Node queues array length must equal pipeline workers array length
# - Each queue should map to exactly one core (via the worker->pipeline->node chain)
# - pipeline.workers must reference valid worker IDs from workers section
# - Node IDs are namespaced per pipeline to prevent collisions

[xbricks]
# Interface declarations (descriptive only - queue count determined by xsk config)
ifaces = [
    { name = "enp2s0f0np0", rxd = 1024, txd = 1024 },
    { name = "enp2s0f1np1", rxd = 1024, txd = 1024 }
]

# --- UMEM DEFINITIONS ---
# 'partitions' sets the fixed denominator (Total Frames / N = Partition Size).
umem = [
    { id = 0, frame_size = 2048, frame_count = 16384, fq_size = 4096, cq_size = 4096, head_room = 128, partitions = 4 },
    { id = 1, frame_size = 4096, frame_count = 8192,  fq_size = 2048, cq_size = 2048, head_room = 256, partitions = 4 }
]

# --- XSK SOCKET CONFIG ---
# XSK socket configuration (core affinity is derived from worker assignments)
xsk = [
    { iface = "enp2s0f0np0", queues = [0, 1], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true },
    { iface = "enp2s0f1np1", queues = [0, 1], umem = 1, rxq_size = 4096, txq_size = 4096, zerocopy = true },
]

# --- WORKER & PARTITION ASSIGNMENT ---
# Workers request specific partition quotas from the UMEMs.
# The builder automatically pops the next available partition index for that UMEM.
workers = [
    { id = 0, core = 0, partitions = [ { umem = 0, count = 1 }, { umem = 1, count = 1 } ] },
    { id = 1, core = 1, partitions = [ { umem = 0, count = 1 }, { umem = 1, count = 2 } ] }
]

[[pipelines]]
name = "wire f0 to f1"
workers = [0, 1]

# --- Node 1: Source ---
[[pipelines.nodes]]
id = "wire.rx_source_0"
type = "BatchRxNode"
next = "wire.ethertype_stats_01"
queues = [0, 1]
args = { source_type = "xsk", interface = "enp2s0f0np0" }

# --- Telemetry Node ---
[[pipelines.nodes]]
id = "wire.ethertype_stats_01"
type = "TelemetryNode"
next = "wire.tx_sink_1"

[pipelines.nodes.args]
algo = "ethertype"
buckets = "4"         # We expect 4 buckets (IPv4, IPv6, ARP, Other)
labels = "IPv4,IPv6,ARP,Other" # Optional: For the metrics exporter to name them

# --- Node 2: Sink ---
[[pipelines.nodes]]
id = "wire.tx_sink_1"
type = "BatchTxNode"
queues = [0, 1]
args = { sink_type = "xsk", interface = "enp2s0f1np1" }


[[pipelines]]
name = "wire f1 to f0"
workers = [0, 1]

# --- Node 1: Source ---
[[pipelines.nodes]]
id = "wire.rx_source_1"
type = "BatchRxNode"
next = "wire.ethertype_stats_10"
queues = [0, 1]
args = { source_type = "xsk", interface = "enp2s0f1np1"}

# --- Telemetry Node ---
[[pipelines.nodes]]
id = "wire.ethertype_stats_10"
type = "TelemetryNode"
next = "wire.tx_sink_0"

[pipelines.nodes.args]
algo = "ethertype"
buckets = "4"         # We expect 4 buckets (IPv4, IPv6, ARP, Other)
labels = "IPv4,IPv6,ARP,Other" # Optional: For the metrics exporter to name them


# --- Node 2: Sink ---
[[pipelines.nodes]]
id = "wire.tx_sink_0"
type = "BatchTxNode"
queues = [0, 1]
args = { sink_type = "xsk", interface = "enp2s0f0np0"}


