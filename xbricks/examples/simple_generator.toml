# Multi-interface, single UMEM configuration example
# Demonstrates multiple NICs with one UMEM domain
#
# Architecture:
# - Worker: single-threaded execution unit running on one core (multiple workers can share a core)
# - Pipeline: logical packet processing graph assigned to one or more workers
#   * Each worker gets its own instance of the pipeline
#   * Node queues array maps 1:1 with pipeline workers array (queues[i] → workers[i])
# - Node: processing element bound to (interface, queues) pair
# - Queue core affinity: DERIVED from worker->pipeline->node->queue chain
#
# Validation rules:
# - Node queues array length must equal pipeline workers array length
# - Each queue should map to exactly one core (via the worker->pipeline->node chain)
# - pipeline.workers must reference valid worker IDs from workers section
# - Node IDs are namespaced per pipeline to prevent collisions

[xbricks]
# Interface declarations (descriptive only - queue count determined by xsk config)
ifaces = [
    { name = "enp114s0f0", rxd = 1024, txd = 1024 },
]

umem = [
    { id = 0, frame_size = 2048, frame_count = 32768, fq_size = 4096, cq_size = 4096, head_room = 128, partitions = 1 },
]
# --- XSK SOCKET CONFIG ---
# XSK socket configuration (core affinity is derived from worker assignments)
xsk = [
    { iface = "enp114s0f0", queues = [0], umem = 0, rxq_size = 1024, txq_size = 1024, zerocopy = true },
]

# --- WORKER & PARTITION ASSIGNMENT ---
# Workers request specific partition quotas from the UMEMs.
# The builder automatically pops the next available partition index for that UMEM.
workers = [
    { id = 0, core = 0, partitions = [ { umem = 0, count = 1 } ] },
]

[[pipelines]]
name = "generator"
workers = [0]

# --- Node 1: Source ---
[[pipelines.nodes]]
id = "wire.pctgen"
type = "PacketGenerator"
next = "wire.tx_sink_1"
pps = 1_000
args = { umem = "0", batch_size = "64" }

# --- Node 2: Sink ---
[[pipelines.nodes]]
id = "wire.tx_sink_1"
type = "BatchTxNode"
queues = [0]
args = { sink_type = "xsk", interface = "enp114s0f0" }
