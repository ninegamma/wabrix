# Multi-interface, single UMEM configuration example
# Demonstrates multiple NICs with one UMEM domain
#
# Note: The term core below refers to the Logical Core ID (as assigned by the OS).
# On systems with Hyper-Threading, this refers to a logical thread,
# not necessarily a full physical core.
# Also note, Linux uses the term CPU for a logical core and CORE for a physical core
#

# Architecture:
# - Worker: single-threaded execution unit running on one core (multiple workers can share a core)
# - Pipeline: logical packet processing graph assigned to one or more workers
#   * Each worker gets its own instance of the pipeline
#   * Node queues array maps 1:1 with pipeline workers array (queues[i] → workers[i])
# - Node: processing element bound to (interface, queues) pair
# - Queue core affinity: DERIVED from worker->pipeline->node->queue chain
#
# Validation rules:
# - Node queues array length must equal pipeline workers array length
# - Each queue should map to exactly one core (via the worker->pipeline->node chain)
# - pipeline.workers must reference valid worker IDs from workers section
# - Node IDs are namespaced per pipeline to prevent collisions

[xbricks]
# Interface declarations (descriptive only - queue count determined by xsk config)
ifaces = [
    { name = "enp2s0f0np0", rxd = 8160, txd = 2048, irq_core = 8 },
    { name = "veth_xbricks", type = "veth", namespace = "ns_xbricks", peer="tap_xbricks", rxd = 1024, txd = 1024, mac_if="enp2s0f0np0", ipnet="192.168.177.222/24" }
]

umem = [
    { id = 0, frame_size = 2048, frame_count = 262144, fq_size = 65536, cq_size = 16384, head_room = 128, partitions = 1 },
    # UMEM 1: Small software pool for the virtual veth interface
    { id = 1, frame_size = 2048, frame_count = 4096, fq_size = 1024, cq_size = 1024, head_room = 128, partitions = 1 },
]

# --- XSK SOCKET CONFIG ---
# XSK socket configuration (core affinity is derived from worker assignments)
# xdp_mode options: "native" (driver mode), "skb"/"generic" (software mode), "auto" (auto-detect, default)
xsk = [
    { iface = "enp2s0f0np0", queues = [0], umem = 0, rxq_size = 32768, txq_size = 4096, zerocopy = true },
    { iface = "veth_xbricks", queues = [0], umem = 1, rxq_size = 1024, txq_size = 1024, zerocopy = false, mode= "auto" },
]

# Note: Physical interface sockets are created upfront, TX-only sockets are created on-demand

# --- WORKER & PARTITION ASSIGNMENT ---
# Workers request specific partition quotas from the UMEMs.
# The builder automatically pops the next available partition index for that UMEM.

workers = [
    { id = 0, core = 9, partitions = [ { umem = 0, count = 1 },  { umem = 1, count = 1 }] },
]

[[pipelines]]
name = "wire_f0_to_veth"
workers = [0]

    # --- if 0: rx ---
    [[pipelines.nodes]]
    id = "nd_receiver"
    type = "BatchRxNode"
    next = "nd_parser"
    queues = [0]
    args = { interface = "enp2s0f0np0", batch_size= "512" }

    # --- Parser Node ---
    [[pipelines.nodes]]
    id = "nd_parser"
    type = "FastParserNode"
    next = "nd_exception"
    args = {}

    [[pipelines.nodes]]
    id = "nd_exception"
    type = "ExceptionRouterNode"
    routes = ["nd_port_counter", "nd_veth_sink"]

    # --- DstPortCounter ---
    [[pipelines.nodes]]
    id = "nd_port_counter"
    type = "DstPortCntNode"
    next = "nd_drop"
    args = { port_ranges = "0-10,80" }

    # --- Veth tx ---
    [[pipelines.nodes]]
    id = "nd_veth_sink"
    type = "BatchTxNode"
    queues = [0]
    args = { interface = "veth_xbricks"}

    # --- Drop Node ---
    [[pipelines.nodes]]
    id = "nd_drop"
    type = "DropNode"
    args = {}


[[pipelines]]
name = "wire_veth_to_f0"
workers = [0]

    # --- Veth rx ---
    [[pipelines.nodes]]
    id = "nd_veth_source"
    type = "BatchRxNode"
    next = "nd_transmitter"
    queues = [0]
    args = {  interface = "veth_xbricks"}

    # --- if 0: tx ---
    [[pipelines.nodes]]
    id = "nd_transmitter"
    type = "BatchTxNode"
    queues = [0]
    args = { interface = "enp2s0f0np0" }
