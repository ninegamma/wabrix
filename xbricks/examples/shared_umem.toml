# Shared UMEM configuration example
# All queues share a single large UMEM (global zero-copy)
# Best performance for cross-queue forwarding
#
# UMEM allocation:
# - UMEM 0: 32768 total frames / 4 cores = 8192 frames per core

[xbricks]
ifaces = [
    { name = "enp2s0f1np1", rxd = 4096, txd = 4096 }
]

umem = [
    # Single large UMEM: 32768 frames shared by 4 cores = 8192 each
    { id = 0, frame_size = 2048, frame_count = 32768, fq_size = 8192, cq_size = 8192, head_room = 128 }
]

xsk = [
    { iface = "enp2s0f1np1", queues = [0, 1, 2, 3], umem = 0, rxq_size = 4096, txq_size = 4096, zerocopy = true }
]

workers = [
    { id = 0, core = 0 },
    { id = 1, core = 1 },
    { id = 2, core = 2 },
    { id = 3, core = 3 }
]
